<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Al Toque</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <h2>Al<span style="color:var(--mustard)">Toque</span></h2>
        <ul>
            <li><a href="home.html" class="active">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="usuarios.html">Usuarios</a></li>
            <li><a href="../index.html">Volver al sitio</a></li>
            <li><a href="#" id="btn-cerrar-sesion">Cerrar sesión</a></li>
        </ul>
    </aside>

    <main class="admin-content">
        <h1>¡Hola Administrador!</h1>
        <p id="saludo-usuario"></p>

        <div class="alert alert-warning" id="alerta-rol" style="display:none;">
            Estás conectado como <strong>Vendedor</strong>: solo puedes visualizar
            productos y usuarios, sin crear ni editar.
        </div>
    </main>
</div>

<script src="../js/productos.js"></script>
<script src="../js/admin.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const sesion = protegerRutaAdmin();
        if (!sesion) return;

        document.getElementById("saludo-usuario").textContent =
            `Sesión iniciada como ${sesion.nombre || sesion.correo} (${sesion.tipoUsuario}).`;

        if (sesion.tipoUsuario === "Vendedor") {
            document.getElementById("alerta-rol").style.display = "block";
        }

        document.getElementById("btn-cerrar-sesion").addEventListener("click", (e) => {
            e.preventDefault();
            localStorage.removeItem("usuarioActivo");
            window.location.href = "../login.html";
        });
    });
</script>
</body>
</html>

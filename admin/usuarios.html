<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Administrador</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <h2>Al<span style="color:var(--mustard)">Toque</span></h2>
        <ul>
            <li><a href="home.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="usuarios.html" class="active">Usuarios</a></li>
            <li><a href="../index.html">Volver al sitio</a></li>
            <li><a href="#" id="btn-cerrar-sesion">Cerrar sesión</a></li>
        </ul>
    </aside>

    <main class="admin-content">
        <h1>Usuarios</h1>

        <p><a href="usuario-form.html" class="btn btn-primary" id="link-nuevo-usuario">+ Nuevo usuario</a></p>

        <table class="admin-table">
            <thead>
            <tr>
                <th>RUN</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Tipo</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="tabla-usuarios-body"></tbody>
        </table>
    </main>
</div>

<script src="../js/admin.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const sesion = protegerRutaAdmin();
        if (!sesion) return;

        renderTablaUsuarios();

        if (!esAdministrador(sesion)) {
            document.getElementById("link-nuevo-usuario").style.display = "none";
        }

        document.getElementById("btn-cerrar-sesion").addEventListener("click", (e) => {
            e.preventDefault();
            localStorage.removeItem("usuarioActivo");
            window.location.href = "../login.html";
        });
    });
</script>
</body>
</html>

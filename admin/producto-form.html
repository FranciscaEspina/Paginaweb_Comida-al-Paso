<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo/Editar Producto | Administrador</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <h2>Al<span style="color:var(--mustard)">Toque</span></h2>
        <ul>
            <li><a href="home.html">Inicio</a></li>
            <li><a href="productos.html" class="active">Productos</a></li>
            <li><a href="usuarios.html">Usuarios</a></li>
            <li><a href="../index.html">Volver al sitio</a></li>
        </ul>
    </aside>

    <main class="admin-content">
        <h1 id="titulo-formulario">Nuevo Producto</h1>
        <form id="form-producto" class="form-box" novalidate>
            <div class="form-group">
                <label for="codigo">Código de producto</label>
                <input type="text" id="codigo" minlength="3" required>
                <span class="error-message">Mínimo 3 caracteres.</span>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" maxlength="100" required>
                <span class="error-message">Obligatorio, máximo 100 caracteres.</span>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción (opcional)</label>
                <textarea id="descripcion" maxlength="500" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="precio">Precio</label>
                <input type="number" id="precio" min="0" step="0.01" required>
                <span class="error-message">Debe ser 0 o mayor (0 = producto gratis).</span>
            </div>

            <div class="form-group">
                <label for="stock">Stock</label>
                <input type="number" id="stock" min="0" step="1" required>
                <span class="error-message">Solo números enteros, mínimo 0.</span>
            </div>

            <div class="form-group">
                <label for="stockCritico">Stock crítico (opcional)</label>
                <input type="number" id="stockCritico" min="0" step="1">
            </div>

            <div class="form-group">
                <label for="categoria">Categoría</label>
                <select id="categoria" required>
                    <option value="">-- Seleccione --</option>
                    <option value="Completos">Completos</option>
                    <option value="Papas Fritas">Papas Fritas</option>
                    <option value="Bebidas">Bebidas</option>
                </select>
            </div>

            <div class="form-group">
                <label for="imagen">Ruta de imagen (opcional)</label>
                <input type="text" id="imagen" placeholder="img/nombre-archivo.jpg">
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </main>
</div>

<script src="../js/productos.js"></script>
<script src="../js/admin.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const sesion = protegerRutaAdmin();
        if (!sesion || !esAdministrador(sesion)) {
            alert("Solo un Administrador puede crear o editar productos.");
            window.location.href = "productos.html";
            return;
        }

        const idAEditar = localStorage.getItem("productoAEditarId");
        if (idAEditar) {
            document.getElementById("titulo-formulario").textContent = "Editar Producto";
            precargarFormularioProducto();
        }

        document.getElementById("form-producto").addEventListener("submit", (evento) => {
            evento.preventDefault();

            const precio = Number(document.getElementById("precio").value);
            const stock = Number(document.getElementById("stock").value);
            const codigo = document.getElementById("codigo").value.trim();
            const nombre = document.getElementById("nombre").value.trim();
            const categoria = document.getElementById("categoria").value;

            // Validación mínima
            if (codigo.length < 3 || !nombre || !categoria || precio < 0 || stock < 0 || !Number.isInteger(stock)) {
                alert("Revisa los campos: hay datos inválidos o incompletos.");
                return;
            }

            const datosProducto = {
                codigo,
                nombre,
                descripcion: document.getElementById("descripcion").value.trim(),
                precio,
                stock,
                stockCritico: Number(document.getElementById("stockCritico").value) || 0,
                categoria,
                imagen: document.getElementById("imagen").value.trim() || "img/producto-generico.jpg",
            };

            guardarProductoDesdeForm(datosProducto, idAEditar);
            limpiarEdicionProducto();

            alert("Producto guardado con éxito.");
            window.location.href = "productos.html";
        });
    });
</script>
</body>
</html>
